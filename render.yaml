services:
  - type: web
    name: shopflow-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: shopflow-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: shopflow-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: shopflow-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: shopflow-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: shopflow-db
          property: password

databases:
  - name: shopflow-db
    plan: free
    databaseName: ecommerce
    user: ecommerce
