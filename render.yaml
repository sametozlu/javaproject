# ShopFlow — Render Blueprint (tek tik deploy: RENDER-DEPLOY.bat)
services:
  - type: web
    name: shopflow-api
    runtime: docker
    repo: https://github.com/sametozlu/javaproject
    branch: main
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: APP_URL
        value: https://shopflow-api-g0x5.onrender.com
      - key: SPRING_PROFILES_ACTIVE
        value: prod,render
      - key: JWT_SECRET
        generateValue: true
      - key: APP_MAIL_ENABLED
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://shopflow-api-g0x5.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: shopflow-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: shopflow-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: shopflow-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: shopflow-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: shopflow-db
          property: password

databases:
  - name: shopflow-db
    plan: free
    databaseName: ecommerce
    user: ecommerce
